name: sandbox-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, sandbox-main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.5
      - run: ruff check addons tests
      - run: python -m compileall -q addons tests
      - run: python -m unittest discover -s tests -v
      - run: docker compose config -q
